      - "AXIS +X FROM THE NOSE TIP; LAUNCH CAP AHEAD OF THE NOSE."
      - "OVERALL DIMENSIONS ARE MEASURED FROM SAVED CAD."
    dimensions:
      front:
        - type: overall
