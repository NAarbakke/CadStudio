schema_version: 1
title: GE/NASA Energy Efficient Engine (E3)
subtitle: Two-spool long-duct mixed-flow turbofan / NASA CR-165398 programme
document_id: CS-GE-E3-TF
revision: A
status: Sourced study reconstruction. Drawing dimensions describe the CAD model.
summary: >-
  A 22-part display model of the E3 flight propulsion system in 5 sub-assemblies: 32-blade fan with part-span
  shrouds and quarter-stage booster, 64 swept bypass outlet guide vanes, 10-stage 23:1 compressor, double-annular
  combustor, 2-stage high-pressure and 5-stage low-pressure turbine at their design airfoil counts, 18-lobe mixer,
  centre plug, and a nacelle in four sections (inlet with a polished lip skin, composite fan frame cowl, reverser,
  tailpipe). Dimensions and flow path follow the E3 NASA report; airfoils and internals are simplified.
model:
  source: models/ge_e3_turbofan/src/ge_e3_turbofan.py
  step: models/ge_e3_turbofan/STEP/ge_e3_turbofan.step
materials: {}
part_materials: {}
renders:
  - id: exterior
    title: Exterior assembly
    source: glb
    camera: "210:20"
    display: render
  - id: plan
    title: Plan view
    source: glb
    camera: "0:90"
    display: render
    caption: Flow follows +X from the fan face at x = 0 to the exhaust nozzle.
  - id: longitudinal_section
    title: Longitudinal section / XY plane
    mode: section
    section: XY
    camera: "0:90"
    display: solid
    caption: >-
      Section through the engine axis: fan and booster, bypass duct with outlet guide vanes, ten-stage compressor,
      double-annular combustor, turbines, mixer and plug.
