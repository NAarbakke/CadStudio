sources:
  - id: E3
    title: Energy Efficient Engine, flight propulsion system final design and analysis (GE/NASA, 1981).
    locator: "Table I, Figure 2 cross-section, Figure 20 nacelle arrangement. Local file: models/ge_e3_turbofan/profile/E3_energy_efficient_engine_1981.pdf."
  - id: CR165148
    title: E3 fan component design report (NASA CR-165148).
    locator: Part-span shrouds at 50 % span, 64 swept and leaned OGVs, 56-blade quarter-stage rotor. See models/ge_e3_turbofan/profile/.
  - id: CR168219
    title: E3 flight propulsion system design report (NASA CR-168219).
    locator: Mixer, 18 scalloped lobes with radial sidewalls. Compressor, HPT and LPT airfoil counts come from CR-165558, CR-167955 and CR-167956 in the same folder.
assumptions:
  - "Stations and radii are digitised from Figure 2 with the scale taken from the fan diameter, about +/-15 mm."
  - "Airfoils are flat plates, the mixer lobes have radial sidewalls only, and internal structure is simplified."
  - "HPC stators 2 and 5 were read from a poor scan."
  - "The nacelle contour between the Table I dimensions, the stations where its four sections meet, the separate lip skin and the bevelled joint lines are assumed for appearance."
  - "Plug mounting bolts, HPT disk tie bolts, the shaft/rotor split of each spool and all corner rounding are assumed; no holes are cut."
  - "Display finishes are not material assignments; no physical material or density has been inferred from them."
