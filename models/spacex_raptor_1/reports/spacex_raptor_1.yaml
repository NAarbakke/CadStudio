schema_version: 1
title: SpaceX Raptor 1
subtitle: Sea-level full-flow staged-combustion methane/oxygen engine, 2019-21
document_id: CS-SPX-R1
revision: A
status: Photograph-based reconstruction. Overall size is published; proportions are read at about +/-5 %.
summary: >-
  A 36-part display model in 5 sub-assemblies: mount plate and gimbal block on a thrust frame, oxygen pump and
  preburner on the chamber axis, diameter 870 hot-gas manifold disc on the main injector, methane turbopump under
  the disc, jacketed chamber with a coolant collector, heat-tinted throat and manifold, short wide bell, a pump
  discharge duct wrapped around the chamber, seven small lines, two engine controllers with wiring, valves with
  actuators, a torch igniter, sensor ports and bolted flanges throughout.
model:
  source: models/spacex_raptor_1/src/spacex_raptor_1.py
  step: models/spacex_raptor_1/STEP/spacex_raptor_1.step
materials: {}
part_materials: {}
renders:
  - id: exterior
    title: Exterior assembly
    source: glb
    camera: "210:20"
    display: render
  - id: plan
    title: Plan view
    source: glb
    camera: "0:90"
    display: render
    caption: The engine axis is +X from the top of the engine to the nozzle exit; the methane turbopump is at +Y.
  - id: longitudinal_section
    title: Longitudinal section / XY plane
    mode: section
    section: XY
    camera: "0:90"
    display: solid
    caption: "Section through the engine axis: chamber, throat, coolant manifold and the short wide bell."
