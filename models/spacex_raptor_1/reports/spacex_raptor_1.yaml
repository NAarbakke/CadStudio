sources:
  - id: WIKI
    title: Wikipedia, "SpaceX Raptor" (length, diameter, expansion ratio, thrust, mass, chamber pressure).
    locator: "Public figures. See models/spacex_raptor_1/profile/README.md."
  - id: PHOTOS
    title: SpaceX photographs of Raptor 1, 2 and 3 and of a sea-level Raptor at Hawthorne.
    locator: "Local files: models/spacex_raptor_1/profile/. Stations and diameters of the main masses read at about +/-5 %. Everyday Astronaut, Raptor 1 vs Raptor 2, for the flanged, instrumented layout."
assumptions:
  - "Taken from sources: overall length, exit diameter, expansion ratio and, from photographs, the layout and the main masses."
  - "Assumed for appearance (models/lib/raptor.py): housing shapes, chamber and bell contour, duct routing and diameters, flange and bolt sizes and counts, corner radii."
  - "The small lines, controllers, wiring and actuators are indicative; their number, size and routing are not from the sources, and the real powerhead is far denser. Gimbal actuators are not modelled."
  - "Fasteners are a nut and stud end standing on a flange face; no holes are cut."
  - "Display finishes are not material assignments; no physical material or density has been inferred from them."
