    locator: "Figure 1 cross-section (stations and walls read off it, about +/-2 mm), Table II airfoil counts, Table III row dimensions. Local file: models/nasa_lewis_small_turbojet/profile/TMX-3392_design_fabrication_1976.pdf."
assumptions:
  - "Airfoil stagger and twist are not tabulated; sections are elliptical and stacked radially."
  - "The 8-vane swirlers and liner perforations are left out."
  - "Wall and flange thicknesses, disk web and bore shapes, strut thickness, fuel control box size, trunnion boss size and igniter clocking are assumed."
  - "Every bolt circle (counts, sizes, radii) at the inlet flange and the five casing joints, edge chamfers, bearing corner radii and the igniter boss/plug split are assumed for appearance; no holes are cut."
  - "Display finishes are not material assignments; no physical material or density has been inferred from them."
