schema_version: 1
title: NASA Lewis small expendable turbojet
subtitle: 1976-77 low-cost turbojet / NASA TM X-3392
document_id: CS-NASA-STJ
revision: A
status: Sourced study reconstruction. Drawing dimensions describe the CAD model.
summary: >-
  A 21-part display model in 6 sub-assemblies: two-strut inlet housing with gearbox and front bearing, fuel control,
  welded 4-stage blade-disk drum with lofted airfoils at the design counts, annular snout combustor with manifold,
  12 nozzles and igniters, hollow mainshaft, one-piece 35-vane turbine stator, 57-blade rotor, strutted exhaust
  with the rear bearing, convergent nozzle and bolted casing joints.
